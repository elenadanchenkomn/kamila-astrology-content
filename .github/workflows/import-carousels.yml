name: Import Kamila carousel images

on:
  push:
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract PNG files safely
        run: |
          python3 automation/import_carousels.py
      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/2026/10/
          if ! git diff --cached --quiet; then
            git commit -m "Import carousel images"
            git push
          fi
